# Reusable workflow: PR title lint (Conventional Commits).
#
#   on:
#     pull_request_target:
#       types: [opened, edited, reopened, synchronize]
#   jobs:
#     lint:
#       uses: shamwari-ai/.github/.github/workflows/reusable-pr-title-lint.yml@main
#
# Checks the PR TITLE, not commit messages — the org squash-merges, so the
# PR title becomes the commit subject on main.
#
# The allowed types track CONTRIBUTING.md. Change both together.

name: Reusable / PR title lint

on:
  workflow_call:
    inputs:
      require-scope:
        description: If true, a scope like `feat(gateway):` is required.
        type: boolean
        default: false

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint:
    name: Conventional Commits
    # Dependabot titles its PRs "ci: Bump actions/checkout from 6 to 7" —
    # capital B, which subjectPattern rejects, and it offers no setting to
    # lowercase that word (commit-message.prefix controls only the prefix).
    # Relaxing the pattern to allow uppercase would weaken it for humans
    # too, so bot PRs are skipped instead. Their titles are machine
    # generated and already consistent; there is nothing for this check to
    # catch. Add other bots here rather than loosening the pattern.
    if: >-
      ${{ github.event.pull_request.user.login != 'dependabot[bot]'
          && github.event.pull_request.user.login != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      # Third-party action, pinned by commit SHA rather than tag: a tag can
      # be moved to point at different code, a SHA cannot.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          requireScope: ${{ inputs.require-scope }}
          subjectPattern: '^(?![A-Z])(?!.*\.$).+$'
          subjectPatternError: >-
            The subject "{subject}" is invalid for the "{type}" type: start it
            lowercase, write it as an imperative ("add", not "adds"/"added"),
            and do not end it with a period.
          # Exempts titles literally starting with "wip" (case insensitive).
          # This is NOT the same as GitHub's draft flag: a draft PR with an
          # ordinary title still gets checked and can still fail.
          wip: true
