# Reusable workflow: Python CI for a pip-compile / --generate-hashes repo.
#
#   jobs:
#     ci:
#       uses: shamwari-ai/.github/.github/workflows/reusable-ci-python-piptools.yml@main
#       with:
#         working-directory: .
#
# Deliberately NOT nyuchi/.github's reusable-ci-python-monorepo.yml, which
# assumes a uv workspace (root pyproject.toml with [tool.uv.workspace], a
# committed uv.lock, packages under packages/<name>/). shamwari-core's
# dependency setup is requirements.in -> pip-compile --generate-hashes ->
# requirements.txt, a different shape entirely. See ORG_STANDARDS.md.

name: Reusable / Python CI (pip-tools)

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      python-version:
        type: string
        default: "3.11"
      lock-check-script:
        description: Script asserting the lock still pins what the spec names.
        type: string
        default: "check_lock.py"
      import-check:
        description: Python statement proving the package imports. Empty skips it.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ci:
    name: lock, install, import
    runs-on: ubuntu-latest
    env:
      # Core reads its configuration at import time and fails loudly on a
      # missing variable. Placeholders are enough to prove it imports —
      # neither Mongo nor Postgres is contacted until a request arrives.
      MONGODB_URI: mongodb://placeholder
      SUPABASE_DB_URL: postgresql://placeholder
      SHAMWARI_CORE_TOKEN: placeholder
      CF_ACCOUNT_ID: placeholder
      CF_API_TOKEN: placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements.txt

      # Offline and deterministic: asserts the lock still pins everything
      # requirements.in names, and that it carries hashes. Runs BEFORE the
      # install so a stale lock is named as such rather than surfacing as a
      # confusing ImportError further down.
      - name: Lockfile matches spec
        if: ${{ inputs.lock-check-script != '' }}
        env:
          SCRIPT: ${{ inputs.lock-check-script }}
        run: python "$SCRIPT"
        working-directory: ${{ inputs.working-directory }}

      # --require-hashes is redundant while every line has a hash, and it is
      # here so that a line WITHOUT one fails the install instead of quietly
      # dropping hash enforcement for the whole file. requirements.txt is
      # generated by pip-compile --generate-hashes and must never be
      # hand-edited.
      - name: Install (hash-pinned)
        run: pip install --require-hashes -r requirements.txt
        working-directory: ${{ inputs.working-directory }}

      - name: Import check
        if: ${{ inputs.import-check != '' }}
        env:
          STMT: ${{ inputs.import-check }}
        run: python -c "$STMT"
        working-directory: ${{ inputs.working-directory }}
