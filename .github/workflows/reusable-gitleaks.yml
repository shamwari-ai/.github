# Reusable workflow: secret scanning with gitleaks.
#
#   jobs:
#     secrets:
#       uses: shamwari-ai/.github/.github/workflows/reusable-gitleaks.yml@main
#
# Runs the gitleaks binary directly rather than gitleaks/gitleaks-action.
# That wrapper now requires a paid licence for organisation repos; the
# underlying binary is still MIT-licensed, so calling it directly keeps
# this scan free.

name: Reusable / Secret scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: "8.21.2"
      fetch-depth:
        description: 0 scans full history. 1 scans only the checked-out tree.
        type: number
        default: 0

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          curl -sSL --fail -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository
        run: gitleaks detect --source . --redact --no-banner --verbose
