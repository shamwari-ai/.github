# Copy to .github/dependabot.yml in a consuming repo and delete the
# ecosystems it does not have. Dependabot config is per-repo — nothing in
# this org-defaults repo propagates automatically.

version: 2
updates:
  # Keep the reusable workflows' own action pins fresh. Worth having in
  # every repo: a SHA-pinned third-party action never updates otherwise.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # npm. Grouped so a routine week is one PR, not fifteen.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Python. NOTE: shamwari-core's requirements.txt is generated by
  # pip-compile --generate-hashes and must never be hand-edited. Dependabot
  # edits requirements.txt directly, so a Dependabot PR here will drop the
  # hashes and fail CI at the --require-hashes install step. Bump
  # requirements.in and recompile instead — that is why this block is
  # commented out rather than shipped enabled.
  #
  # - package-ecosystem: pip
  #   directory: "/"
  #   schedule:
  #     interval: weekly
